[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-data-agent"
version = "2.1.0"
description = "Local AI data agent: natural-language SQL analytics and safe ETL with Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "langgraph==0.2.62",
    "langchain==0.3.14",
    "langchain-ollama==0.2.0",
    "pandas==2.2.3",
    "pyarrow>=18,<26",
    "openpyxl==3.1.5",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.0.1",
    "sqlparse==0.5.1",
    "python-multipart==0.0.17",
    "requests==2.32.3",
    "structlog==24.4.0",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "httpx==0.28.1",
    "types-requests",
    "types-psycopg2",
    "pandas-stubs",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["qa"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "UP007", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"src/api/__init__.py" = ["F401"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
markers = ["integration: needs a live Postgres (see tests/integration)"]

[tool.coverage.run]
source = ["src"]
omit = ["src/security/_sandbox_runner.py"]
